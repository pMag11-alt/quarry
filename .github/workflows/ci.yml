name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: [21]
        include:
          - os: ubuntu-latest
            java: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew test installDist
      - name: CLI and HTTP smoke test
        run: scripts/smoke.sh

  lucene:
    name: Parity with Lucene on BEIR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache BEIR datasets
        uses: actions/cache@v4
        with:
          path: data
          key: beir-v1-scifact-nfcorpus-arguana-fiqa
      - name: Download BEIR datasets
        run: scripts/download_beir.sh scifact nfcorpus arguana fiqa
      - name: Same rankings and scores as Lucene, query by query
        shell: bash
        run: ./gradlew compareLucene -q -Pdatasets=data/scifact,data/nfcorpus,data/arguana,data/fiqa | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tokenizer fuzzing against Lucene (300K strings)
        run: ./gradlew test --rerun --tests 'quarry.analysis.LuceneAnalysisParityTest'
        env:
          QUARRY_FUZZ: "300000"
          QUARRY_FUZZ_SEED: "7"
